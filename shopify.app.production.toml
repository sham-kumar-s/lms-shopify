# Shopify Production App Configuration
# This file should be configured with production values before deployment

# IMPORTANT: Replace with your production Shopify app client ID
client_id = "YOUR_PRODUCTION_CLIENT_ID"

# Production application URL - update after deploying web application
application_url = "https://your-production-domain.com"

embedded = true
name = "LMS App"

[access_scopes]
scopes = ""
optional_scopes = []
use_legacy_install_flow = false

[auth]
# Production redirect URLs will be automatically configured based on application_url
redirect_urls = []

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"
